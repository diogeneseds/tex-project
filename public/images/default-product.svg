<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 159" width="280" height="159">
  <defs>
    <linearGradient id="prodBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="prodGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2222D3" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
    <pattern id="prodGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#70EDED" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="280" height="159" fill="url(#prodBgGrad)" />
  <rect width="280" height="159" fill="url(#prodGrid)" />
  <rect width="280" height="159" fill="url(#prodGlow)" />

  <!-- Shopping Bag / Tag Icon -->
  <g transform="translate(126, 38)">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#70EDED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <path d="M16 10a4 4 0 0 1-8 0"></path>
    </svg>
  </g>

  <!-- Brand Typography -->
  <text x="140" y="94" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="900" font-size="14" letter-spacing="2" fill="#FFFFFF">OFERTAS <tspan fill="#70EDED">TECEXTREME</tspan></text>
  <text x="140" y="116" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#64748B">PRODUTO EM BREVE</text>
</svg>
